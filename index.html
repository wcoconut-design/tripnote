<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="트립노트">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<title>트립노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F0EEE9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>
<style>
/* Layout: one phone-width column (max 560px), sticky top bar, fixed bottom tabs, bottom sheets for every form. */
:root{
  /* 클라우드 댄서 (Pantone 2026 Cloud Dancer) — default light */
  --bg:#F0EEE9; --surface:#FBFAF7; --ink:#2E2C29; --muted:#6B665F;
  --accent:#4D6277; --on-accent:#FFFFFF; --soft:#D4E2EE; --tag:#F0D8CC; --tag-ink:#6B3F2E;
  --line:#DEDAD3; --p1:#D4E2EE; --p2:#F0D8CC; --p3:#CAD3C1;
  --danger:#B3302A; --on-danger:#FFFFFF; --danger-soft:#F6E1DE;
  --scrim:rgba(30,28,26,.5); --shadow:0 1px 2px rgba(30,28,26,.06),0 4px 14px rgba(30,28,26,.06);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-app-theme]){
    --bg:#232A31; --surface:#2F3842; --ink:#F0EEE9; --muted:#AEB5BC;
    --accent:#79B1D7; --on-accent:#16202A; --soft:#3A4A5A; --tag:#4A4458; --tag-ink:#DCD3E0;
    --line:#3C4652; --p1:#4D6277; --p2:#5E5853; --p3:#6E5F78;
    --danger:#F08A84; --on-danger:#2A1614; --danger-soft:#4A2F33;
    --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-app-theme]){
  --bg:#232A31; --surface:#2F3842; --ink:#F0EEE9; --muted:#AEB5BC;
  --accent:#79B1D7; --on-accent:#16202A; --soft:#3A4A5A; --tag:#4A4458; --tag-ink:#DCD3E0;
  --line:#3C4652; --p1:#4D6277; --p2:#5E5853; --p3:#6E5F78;
  --danger:#F08A84; --on-danger:#2A1614; --danger-soft:#4A2F33;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}
:root[data-app-theme="cloud"]{
  --bg:#F0EEE9; --surface:#FBFAF7; --ink:#2E2C29; --muted:#6B665F;
  --accent:#4D6277; --on-accent:#FFFFFF; --soft:#D4E2EE; --tag:#F0D8CC; --tag-ink:#6B3F2E;
  --line:#DEDAD3; --p1:#D4E2EE; --p2:#F0D8CC; --p3:#CAD3C1;
  --danger:#B3302A; --on-danger:#FFFFFF; --danger-soft:#F6E1DE;
  --scrim:rgba(30,28,26,.5); --shadow:0 1px 2px rgba(30,28,26,.06),0 4px 14px rgba(30,28,26,.06); color-scheme:light;
}
:root[data-app-theme="pastel"]{
  --bg:#F6EEEF; --surface:#FFFFFF; --ink:#3A2E33; --muted:#6E6066;
  --accent:#8A5A6E; --on-accent:#FFFFFF; --soft:#EBD5DA; --tag:#F6EBC8; --tag-ink:#6A5A1E;
  --line:#E8DCDF; --p1:#EBD5DA; --p2:#DCD5E0; --p3:#F6EBC8;
  --danger:#B3302A; --on-danger:#FFFFFF; --danger-soft:#F8E0DE;
  --scrim:rgba(58,46,51,.5); --shadow:0 1px 2px rgba(58,46,51,.06),0 4px 14px rgba(58,46,51,.07); color-scheme:light;
}
:root[data-app-theme="shadow"]{
  --bg:#EDEBE7; --surface:#F8F7F4; --ink:#2F2D2B; --muted:#66615C;
  --accent:#756F6A; --on-accent:#FFFFFF; --soft:#C8E5C9; --tag:#E2DAE6; --tag-ink:#5A4766;
  --line:#DAD6D0; --p1:#C8E5C9; --p2:#D5CD94; --p3:#C9BCCF;
  --danger:#B3302A; --on-danger:#FFFFFF; --danger-soft:#F3E0DC;
  --scrim:rgba(47,45,43,.5); --shadow:0 1px 2px rgba(47,45,43,.06),0 4px 14px rgba(47,45,43,.06); color-scheme:light;
}
:root[data-app-theme="night"]{
  --bg:#232A31; --surface:#2F3842; --ink:#F0EEE9; --muted:#AEB5BC;
  --accent:#79B1D7; --on-accent:#16202A; --soft:#3A4A5A; --tag:#4A4458; --tag-ink:#DCD3E0;
  --line:#3C4652; --p1:#4D6277; --p2:#5E5853; --p3:#6E5F78;
  --danger:#F08A84; --on-danger:#2A1614; --danger-soft:#4A2F33;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{flex-shrink:0}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 168px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:4px;padding-block:8px 6px;margin-inline:-8px}
.tt{flex:1;min-width:0;text-align:center}
.tt h1{margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt p{margin:1px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.btns{display:flex}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:20px 14px}
.h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0;text-wrap:balance}
.eyebrow{margin:0;font-size:13px;color:var(--muted)}
.cap{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.minw{min-width:0;flex:1}

.iconbtn{width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0;text-decoration:none}
.iconbtn.filled{background:var(--surface)}
.iconbtn svg{width:22px;height:22px}
.iconbtn.sm{color:var(--muted)}
.iconbtn.sm svg{width:16px;height:16px}

.seg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:4px;padding:4px;background:var(--line);border-radius:12px}
.seg-btn{height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:500}
.seg-btn.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

.btn{height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;flex-shrink:0}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.soft{background:var(--soft);border-color:var(--soft);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{height:40px;padding:0 12px;font-size:14px;border-radius:12px}
.btn.dashed{border:1.5px dashed var(--muted);background:transparent;color:var(--accent);font-weight:700}

.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.section-title{margin:0 0 0 4px;font-size:14px;font-weight:600;color:var(--muted)}
.banner{margin-top:14px;background:var(--soft);border-radius:16px;padding:12px 12px 12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.banner p{margin:0;flex:1;min-width:180px}
.banner.warnb{background:var(--tag);color:var(--tag-ink)}
#search-q{-webkit-appearance:none;appearance:none}
.today{margin-top:14px;background:var(--surface);border-radius:20px;padding:14px 14px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);border:1.5px solid var(--accent)}
.today-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.today-head .cap{color:var(--accent)}
.today .wx-mini{font-size:13px}
.today .wx-mini svg{width:16px;height:16px}
.next{display:flex;gap:12px;align-items:flex-start}
.next-time{margin:2px 0 0;font-size:24px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;min-width:68px}
.next-main{flex:1;min-width:0;border:0;background:transparent;padding:0;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.next-main b{font-size:19px;overflow-wrap:anywhere}
.next-main small{font-size:13px;color:var(--muted)}
.today-empty{margin:0;font-size:14px;color:var(--muted)}
.today-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.today-list li{display:flex;gap:12px}
.today-list span{min-width:68px;color:var(--muted);font-variant-numeric:tabular-nums}

.tripcard{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.tripcard-main{display:block;width:100%;text-align:left;border:0;padding:0;background:transparent;color:var(--ink)}
.qlinks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 14px 14px}
.ql{min-height:56px;border:0;border-radius:12px;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--muted)}
.ql b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.cover{position:relative;height:132px;background:var(--p1);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cover svg{width:34px;height:34px;opacity:.7}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 18px;color:var(--ink);text-align:left}
.gen b{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.gen small{font-size:13px;opacity:.75;font-variant-numeric:tabular-nums;margin-top:2px}
.gen.gen-sq{padding:0;align-items:center;justify-content:center}
.gen.gen-sq{font-family:var(--serif);font-size:22px;font-weight:700}
.cover-pick{display:flex;flex-direction:column;gap:8px}
.cover-prev{position:relative;height:120px;border-radius:14px;overflow:hidden;background:var(--p1)}
.cover-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-btns{display:flex;flex-wrap:wrap;gap:6px}
.ph-tile[data-act]{border:0;padding:0;cursor:pointer}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:12px;left:12px;background:var(--tag);color:var(--tag-ink);font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.badge.now{background:var(--accent);color:var(--on-accent)}
.tripcard-body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:4px}
.tripcard h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:13px;background:var(--bg);padding:4px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.chip-sample{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--ink);letter-spacing:.02em}
.list{background:var(--surface);border-radius:18px;padding:4px 0}
.list-row{display:flex;align-items:center;gap:14px;padding:10px 16px;width:100%;border:0;background:transparent;text-align:left;color:var(--ink)}
.list-row + .list-row{border-top:1px solid var(--line)}
.list-row h3{margin:0;font-size:16px;font-weight:600}
.list-row p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.list-row > svg{color:var(--muted);width:18px;height:18px}
.sq{width:52px;height:52px;border-radius:14px;background:var(--p2);overflow:hidden;flex-shrink:0;position:relative}
.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.backupbar{margin-top:26px;background:var(--surface);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.backupbar p{margin:0;font-size:13px;color:var(--muted)}
.empty{background:var(--surface);border-radius:18px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{margin:0;font-size:17px}
.empty p{margin:0;color:var(--muted);font-size:14px;max-width:32ch}

.fab{position:fixed;right:max(calc(20px + env(safe-area-inset-right,0px)),calc((100vw - 560px)/2 + 20px));bottom:calc(24px + env(safe-area-inset-bottom,0px));height:54px;min-width:54px;padding:0 20px 0 16px;border:0;border-radius:27px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:6}
.fab svg{width:22px;height:22px}
.fab.round{padding:0;width:56px;height:56px;border-radius:28px}
.fab.above{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{height:62px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);font-weight:700}

.daytabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin-top:4px}
.daytabs::-webkit-scrollbar{display:none}
.daytab{flex:0 0 auto;min-width:78px;height:56px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 10px}
.daytab b{font-size:14px}
.wx-mini{display:flex;align-items:center;gap:2px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted);margin-top:1px}
.daytab.on .wx-mini{color:var(--on-accent)}
.wx-mini svg{width:13px;height:13px}
.daytab:has(.wx-mini){height:70px}
.wxline{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:10px 8px 10px 14px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);text-align:left;min-height:56px}
.wxline > svg{width:28px;height:28px;color:var(--accent)}
.wxline b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.wxline small{display:block;font-size:12px;color:var(--muted)}
.wx-place{display:flex;align-items:center;gap:2px;font-size:13px;color:var(--muted);flex-shrink:0;max-width:40%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wx-place svg{width:16px;height:16px}
.daytab span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.daytab.on{background:var(--accent);color:var(--on-accent)}
.daytab.on span{color:var(--on-accent)}

.quick{display:flex;gap:8px;margin-top:12px}
.input{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:16px;width:100%;min-width:0;color:var(--ink)}
textarea.input{height:auto;min-height:92px;padding:12px 14px;line-height:1.55;resize:vertical}
select.input{padding-right:8px}
.quick .input{border-radius:14px}
.quick .btn{width:48px;padding:0}

.timeline{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.tl-row{display:flex;gap:10px}
.tl-time{margin:14px 0 0;width:46px;flex-shrink:0;font-size:14px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.swipe{position:relative;flex:1;min-width:0;border-radius:16px;overflow:hidden;background:var(--line)}
.swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex;visibility:hidden}
.swipe.sw .swipe-actions{visibility:visible}
.swipe-actions button{width:72px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
.swipe-actions button svg{width:18px;height:18px}
.swipe-actions button.danger{background:var(--danger);color:var(--on-danger)}
.swipe-card{position:relative;background:var(--surface);padding:12px 6px 12px 14px;touch-action:pan-y;transition:transform .2s ease;display:flex;flex-direction:column;gap:8px;border-radius:16px;cursor:pointer;user-select:none;-webkit-user-select:none}
.row-top{display:flex;align-items:flex-start;gap:8px}
.row-top h3{margin:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.memo{margin:3px 0 0;font-size:13px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mapbtn{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mapbtn svg{width:18px;height:18px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:64px;height:64px;border-radius:10px;border:0;padding:0;overflow:hidden;background:var(--p2);position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
img[data-photo]:not([src]){visibility:hidden}
.bk-ev{flex:1;min-width:0;display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:16px;padding:4px 6px 4px 4px;box-shadow:inset 0 0 0 1px var(--line)}
.bk-ev-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);text-align:left;padding:8px 6px;border-radius:12px}
.bk-ev-main h3{margin:0;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.bk-ev .kind-ic{width:36px;height:36px;border-radius:10px}
.bk-ev .kind-ic svg{width:18px;height:18px}
.bigcard .kind-big{flex:none;height:150px;border-radius:16px;background:var(--soft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700}
.bigcard .kind-big.stay{background:var(--tag);color:var(--tag-ink)}
.bigcard .kind-big.transit{background:var(--p3);color:var(--ink)}
.bigcard .kind-big svg{width:40px;height:40px}
.toggle{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;margin:0}
.swipe-hint{margin:10px 0 0;font-size:12px;color:var(--muted);text-align:center}

.diary{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.diary-date{font-family:var(--serif);font-size:28px;font-weight:700;margin:2px 0 0;text-wrap:balance}
.collage{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:8px;height:210px}
.collage.one{grid-template-columns:minmax(0,1fr)}
.cl-side{display:flex;flex-direction:column;gap:8px;min-height:0}
.cl{position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;background:var(--p1);flex:1;min-height:0;display:block;width:100%}
.cl:nth-child(2){background:var(--p2)}
.cl-side .cl:last-child{background:var(--p3)}
.cl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cl .more{position:absolute;inset:0;background:var(--scrim);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.cl-empty{height:150px;border-radius:18px;background:var(--p1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink);font-size:14px;text-align:center;padding:0 20px}
.cl-empty svg{width:28px;height:28px;opacity:.7}
.note{width:100%;min-height:96px;border:0;border-radius:18px;background:var(--surface);padding:14px 18px;font-family:var(--serif);font-size:17px;line-height:1.65;resize:vertical;color:var(--ink)}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--line)}
.stop .num{width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stop .t{width:44px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stop button.name{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:12px 0;font-size:15px;font-weight:600;color:var(--ink)}
.stop .mapbtn{background:transparent}

.cardscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:2px 8px;scrollbar-width:none;margin-top:14px}
.cardscroll::-webkit-scrollbar{display:none}
.bigcard{flex:0 0 84%;scroll-snap-align:center;background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bigcard .cl{flex:none;height:150px}
.bigcard h3{margin:2px 0 0;font-size:21px;font-weight:700;overflow-wrap:anywhere}
.bigcard .acts{display:flex;gap:8px;margin-top:auto}
.bigcard .acts .btn.primary{flex:1}
.bigcard .acts .btn:not(.primary){width:48px;padding:0}
.routebtn{margin-top:14px}

.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:4px}
.check-row{display:flex;align-items:center;min-height:48px;padding-right:4px}
.check-row + .check-row{border-top:1px solid var(--line)}
.checkbox{width:46px;height:46px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center}
.box svg{width:15px;height:15px}
.checkbox.on .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check-label{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:12px 4px;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.check-label.done{color:var(--muted);text-decoration:line-through}
.addcheck{display:flex;gap:8px;flex-wrap:wrap}
.addcheck select{width:112px;flex:0 0 auto}
.addcheck .input:not(select){flex:1;min-width:150px}

.bk{width:100%;border:0;text-align:left;background:var(--surface);color:var(--ink);border-radius:18px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.bk-top{display:flex;align-items:center;gap:12px}
.bk-top > svg{color:var(--muted);width:18px;height:18px}
.kind-ic{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kind-ic svg{width:20px;height:20px}
.kind-ic.stay{background:var(--tag);color:var(--tag-ink)}
.kind-ic.transit{background:var(--p3);color:var(--ink)}
.bk h3{margin:1px 0 0;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.bk-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.code{font-family:var(--mono);font-weight:600;font-size:13px;background:var(--bg);padding:4px 8px;border-radius:6px;letter-spacing:.04em}
.panel{background:var(--surface);border-radius:18px;padding:14px 16px}
.panel.row{display:flex;align-items:center;gap:10px;padding-right:10px}
.code-big{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:.06em;margin:2px 0 0;word-break:break-all;user-select:all;-webkit-user-select:all}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.val{margin:2px 0 0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.detail-title{margin:4px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}

.money-sum .total{font-size:30px;font-weight:700;margin:2px 0 0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:14px 0 12px;background:var(--line);gap:2px}
.sbar span{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none;font-size:14px}
.legend li{display:flex;align-items:center;gap:8px}
.legend .dot{width:10px;height:10px;border-radius:5px;flex-shrink:0}
.legend .n{flex:1;min-width:0}
.legend .v{font-variant-numeric:tabular-nums;font-weight:600}
.legend .pct{width:40px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.leg{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.per-person{margin:6px 0 0;font-size:15px;color:var(--muted)}
.per-person b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums;margin-left:4px}
.amt small{display:block;font-size:12px;color:var(--muted)}
.paylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.paylist li{display:flex;align-items:center;gap:10px;font-size:14px}
.paylist .n{flex:1}
.paylist .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.paylist .v small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.pay-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--accent);flex-shrink:0}
.pay-ic svg{width:17px;height:17px}
.pay-ic.cash{background:var(--tag);color:var(--tag-ink)}
.pay-ic.debit{background:var(--bg);color:var(--ink)}
.cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;line-height:18px;margin-left:2px}
.wsub{display:block;font-size:12px;color:var(--muted);text-decoration:none;margin-top:1px}
ol.list{list-style:none;margin:0;padding:4px 0}
.pnum{width:26px;height:26px;margin:0 6px 0 12px;border-radius:13px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.ord{display:flex;flex-shrink:0}
.ord button[disabled]{opacity:.3}
.check-row .mapbtn{margin-right:2px}
.geo-warn{color:var(--danger);font-weight:600}
.dist{color:var(--accent);font-weight:600}
.settle .paylist .v small{font-size:13px}
.settle .paylist li{align-items:flex-start}
.moves{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.move{margin:0;display:flex;align-items:center;gap:6px;font-size:15px}
.move svg{width:16px;height:16px;color:var(--muted)}
.move .amt{margin-left:auto}
.member-list{display:flex;flex-direction:column;gap:6px}
.chipbtn svg{width:14px;height:14px}
.clip svg{width:13px;height:13px;vertical-align:-1px;color:var(--muted)}
.pcard{display:flex;align-items:flex-start;gap:12px;padding:12px 6px 12px 12px}
.pcard + .pcard{border-top:1px solid var(--line)}
.pthumb{width:76px;height:76px;border-radius:12px;overflow:hidden;position:relative;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.pthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
button.pthumb{border:0;padding:0;cursor:pointer}
.ph-add{flex-direction:column;gap:2px;border:1.5px dashed currentColor!important}
.ph-add small{font-size:11px;font-weight:700}
.ph-add svg{width:22px!important;height:22px!important}
.phn{position:absolute;right:4px;bottom:4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pthumb svg{width:28px;height:28px}
.pthumb-wrap{position:relative;flex-shrink:0}
.pnum-badge{position:absolute;top:-6px;left:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--surface)}
.pbody{flex:1;min-width:0;border:0;background:transparent;padding:0;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;cursor:pointer}
.pbody b{font-size:16px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.pbody .orig{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pprice{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.pmemo{font-size:13px;color:var(--ink);opacity:.85;line-height:1.45;margin-top:2px}
.pmeta{font-size:12px;color:var(--muted);margin-top:2px}
.pmeta.dist{color:var(--accent);font-weight:600}
.struck{text-decoration:line-through;color:var(--muted)}
.pright{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.kchip{font-weight:700}
.stars{color:#C9961A;font-size:14px;letter-spacing:1px;margin-top:2px}.stars .off{color:var(--line)}
.kindbar{margin:0}
.wv-photos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.wv-ph{flex:0 0 auto;width:min(70%,260px);aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;position:relative;border:0;padding:0;background:var(--bg)}
.wv-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.orig-big{margin:4px 0 0;font-size:18px;color:var(--muted);overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.menu-list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px}
.menu-list li{display:flex;gap:10px;align-items:center;padding:10px 14px}
.menu-list li + li{border-top:1px solid var(--line)}
.menu-list small{display:block;font-size:12px;color:var(--muted)}
.menu-list .mp{font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
.menu-rows{display:flex;flex-direction:column;gap:10px}
.menu-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;grid-template-areas:"n o d" "p p d";gap:6px;align-items:center;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.menu-edit [data-f="name"]{grid-area:n} .menu-edit [data-f="orig"]{grid-area:o} .menu-edit [data-f="price"]{grid-area:p} .menu-edit .iconbtn{grid-area:d}
.rating{display:flex;gap:2px}
.star{width:44px;height:44px;border:0;background:transparent;font-size:30px;line-height:1;color:var(--line);padding:0}
.star.on{color:#C9961A}
.staff{position:fixed;inset:0;z-index:40;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(64px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));overflow-y:auto;text-align:center;color-scheme:light}
.staff .close{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));color:#111}
.staff-ph{width:min(70vw,320px);aspect-ratio:1;max-width:100%;position:relative;border-radius:16px;overflow:hidden;flex-shrink:0;background:#f2f2f2}
.staff-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.staff-name{margin:0;font-size:clamp(28px,8vw,44px);font-weight:700;line-height:1.3;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",var(--sans);overflow-wrap:anywhere}
.staff-sub{margin:0;font-size:17px;color:#555}
.staff-menu{list-style:none;padding:0;margin:0;font-size:24px;font-weight:700;display:flex;flex-direction:column;gap:12px;font-family:"Hiragino Sans","Noto Sans JP",var(--sans)}
.staff-menu small{display:block;font-size:14px;font-weight:400;color:#666}
.staff-ask{margin:8px 0 0;font-size:22px;color:#333;font-family:"Hiragino Sans","Noto Sans JP",var(--sans)}
.tfbox{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tf-hint{margin:0;font-size:13px;line-height:1.6;color:var(--ink)}
.tf-hint .ok{color:#2E7D4F}.tf-hint .bad{color:var(--danger)}
.tfb{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--accent);vertical-align:1px}
.tfpanel.urgent{border:1.5px solid var(--accent)}
.tfrules{background:var(--surface);border-radius:14px;padding:12px 14px}
.tfrules ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6;display:flex;flex-direction:column;gap:4px}
.tfr{background:var(--surface);border-radius:16px;padding:12px 14px;border-left:0;box-shadow:inset 0 0 0 1.5px var(--line)}
.tfr.ready{box-shadow:inset 0 0 0 1.5px #2E7D4F}
.tfr.done{opacity:.7}
.tfr-head{display:flex;gap:10px;align-items:flex-start}
.tfr-head b{display:block;font-size:16px}
.tfr-head small{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tfr-state{flex-shrink:0;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--bg)}
.tfr.ready .tfr-state{background:#2E7D4F;color:#fff}
.tfr-items{display:flex;flex-direction:column;margin-top:8px}
.tfi{display:flex;align-items:center;gap:10px;min-height:44px;border:0;background:transparent;text-align:left;font-size:15px;color:var(--ink);padding:0}
.tfi .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tfi .box svg{width:15px;height:15px}
.tfi.on .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tfi.on{color:var(--muted)}
.tfr-acts{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.today-tf{margin:0;font-size:14px;font-weight:700;color:var(--accent)}
.today-tf small{font-weight:400;color:var(--muted)}
.warn{margin:10px 0 0;font-size:13px;color:var(--danger);font-weight:600}
.grp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 4px 6px}
.exp-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:10px 14px;text-align:left;color:var(--ink)}
.exp-row + .exp-row{border-top:1px solid var(--line)}
.cat-ic{width:36px;height:36px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cat-ic svg{width:18px;height:18px}
.exp-row b{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.exp-row small{display:block;font-size:12px;color:var(--muted)}
.amt{text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;display:flex;align-items:center;gap:6px}
.chipbtn .dot{width:10px;height:10px;border-radius:5px}
.chipbtn.on{border-color:var(--accent);background:var(--soft);font-weight:700}
.unit{display:flex;align-items:center;padding:0 4px;color:var(--muted);flex-shrink:0}
.paste{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.paste summary{min-height:50px;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);cursor:pointer;list-style:none}
.paste summary::-webkit-details-marker{display:none}
.paste summary svg{width:18px;height:18px}
.paste[open]{padding-bottom:14px;display:flex;flex-direction:column;gap:8px}
.paste .hint:empty{display:none}

/* sheets */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade .18s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overscroll-behavior:contain;animation:up .22s ease}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;position:sticky;top:-8px;background:var(--bg);z-index:2;margin-inline:-4px}
.sheet-head h2{margin:0;font-size:17px;font-weight:700;text-align:center;flex:1;min-width:0}
.sheet-head .spacer{width:56px}
.textbtn{height:44px;min-width:56px;padding:0 6px;border:0;background:transparent;font-size:16px;color:var(--muted)}
.textbtn.strong{color:var(--accent);font-weight:700}
.form{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.hint{margin:0;font-size:12px;color:var(--muted)}
.err{margin:0;font-size:13px;color:var(--danger);font-weight:600}
.inline{display:flex;gap:8px}
.inline .input{flex:1}
.photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ph-tile{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--p1);max-width:100%}
.ph-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-del{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:16px;border:0;background:var(--scrim);color:#fff;display:flex;align-items:center;justify-content:center}
.ph-del svg{width:14px;height:14px}
.addtile{aspect-ratio:1;border:1.5px dashed var(--muted);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--accent);font-size:12px;font-weight:700;background:var(--surface);cursor:pointer;max-width:100%}
.addtile svg{width:22px;height:22px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-align:left}
.opt.on{border-color:var(--accent)}
.opt b{display:block;font-size:15px}
.opt small{display:block;margin-top:1px;font-size:12px;color:var(--muted)}
.opt .ico{width:44px;height:44px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.opt .ico svg{width:22px;height:22px}
.opt .ok{width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt .ok svg{width:15px;height:15px}
.swatches{display:flex;padding-right:6px;flex-shrink:0}
.swatches span{width:22px;height:22px;border-radius:11px;margin-right:-6px;box-shadow:0 0 0 2px var(--surface)}
.share-preview{width:min(100%,36vh);aspect-ratio:4/5;margin:4px auto 0;border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.share-preview img{width:100%;height:100%;object-fit:contain;display:block}
.bigbtn{min-height:64px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;text-align:left}
.bigbtn b{font-size:15px}
.bigbtn small{font-size:12px;color:var(--muted)}
.bigbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bigbtn.primary small{color:var(--on-accent);opacity:.85}
.guide{margin:0;padding-left:18px;font-size:14px;line-height:1.6;color:var(--ink)}
.textview{width:100%;min-height:220px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;width:min(520px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:fade .18s ease}
.toast span{flex:1;min-width:0}
.toast button{height:40px;border:0;background:transparent;color:var(--bg);font-weight:700;padding:0 12px;text-decoration:underline;flex-shrink:0}

.viewer{position:fixed;inset:0;z-index:40;background:rgba(12,12,14,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(60px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer img{max-width:100%;max-height:100%;min-height:0;object-fit:contain;border-radius:8px;-webkit-touch-callout:default}
.viewer .close{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));color:#fff}
.viewer p{margin:0;color:#e9e9ea;font-size:14px;text-align:center}

.cal{background:var(--surface);border-radius:22px;padding:8px 8px 12px;margin-top:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 0 4px 10px}
.cal-head h2{margin:0;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px}
.cal-dow{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding-bottom:4px}
.cal-cell{height:44px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;padding:0;color:var(--ink)}
.cal-cell.in{background:var(--soft)}
.cal-cell.s{border-top-left-radius:22px;border-bottom-left-radius:22px}
.cal-cell.e{border-top-right-radius:22px;border-bottom-right-radius:22px}
.cal-num{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:15px;font-variant-numeric:tabular-nums}
.cal-num.edge{background:var(--accent);color:var(--on-accent);font-weight:700}
.cal-num.today{box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700}

@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function parseQuick(input){

  let h = +m[1]; let mi = m[2] ? +m[2] : m[3] ? +m[3] : m[4] ? 30 : 0;
  if (ap === '오후' && h < 12) h += 12; if (ap === '오전' && h === 12) h = 0;

/* ---------- storage (IndexedDB, on this device) ---------- */
const DB = { db:null, ok:false };
function idbOpen(){
  return new Promise(res => {
    try {
      const r = indexedDB.open('tripnote', 1);
      r.onupgradeneeded = () => { const db = r.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos'); };
      r.onsuccess = () => { DB.db = r.result; DB.ok = true; res(true); };
      r.onerror = () => res(false); r.onblocked = () => res(false);
    } catch(e){ res(false); }
  });
}
function idb(store, mode, fn){
  return new Promise((res, rej) => {
    if (!DB.ok) return rej(new Error('no-db'));
    try {
      const tx = DB.db.transaction(store, mode); const req = fn(tx.objectStore(store));
      tx.oncomplete = () => res(req ? req.result : undefined);
      tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    } catch(e){ rej(e); }
  });
}
const memPhotos = new Map(); const urlCache = new Map();
async function photoPut(id, blob){ memPhotos.set(id, blob); try { await idb('photos','readwrite', s => s.put(blob, id)); } catch(e){} }
async function photoGet(id){
  if (memPhotos.has(id)) return memPhotos.get(id);
  try { const b = await idb('photos','readonly', s => s.get(id)); if (b) memPhotos.set(id, b); return b || null; } catch(e){ return null; }
}
async function photoDel(ids){
  ids = (ids || []).filter(Boolean); if (!ids.length) return;
  ids.forEach(id => { memPhotos.delete(id); const u = urlCache.get(id); if (u){ URL.revokeObjectURL(u); urlCache.delete(id); } });
  try { await idb('photos','readwrite', s => { ids.forEach(id => s.delete(id)); return null; }); } catch(e){}
}

const byTime = (a, b) => (a.time || '99:99').localeCompare(b.time || '99:99');

const airport = x => x ? (/공항|airport/i.test(x) ? x : `${x} 공항`) : '';
function flightRoute(b){
  let from = (b.from || '').trim(), to = (b.to || '').trim();
  if (!from && !to){
    const t = String(b.title || '').trim();
    let parts = t.replace(/\s*왕복$/, '').split(/\s*(?:⇄|↔|→|->|>|~|-)\s*/).filter(Boolean);
    if (parts.length < 2) parts = t.split(/\s+/).filter(Boolean).length === 2 ? t.split(/\s+/) : [];
    if (parts.length > 1){ from = parts[0]; to = parts[parts.length - 1]; }
  }
  return { from, to };
}
function retRoute(b){ const { from, to } = flightRoute(b); return { rfrom: (b.retFrom || '').trim() || to, rto: (b.retTo || '').trim() || from }; }
function bookingName(b){
  const k = KIND[b.kind] || KIND.etc;
  if (b.kind === 'flight'){
    const { from, to } = flightRoute(b);
    if (from && to && b.roundTrip){ const { rfrom, rto } = retRoute(b); return rfrom === to && rto === from ? `${from} ⇄ ${to} 왕복` : `${from} → ${to} · ${rfrom} → ${rto}`; }

    const t = (b.title || '').trim(); return t && !['출발','도착','항공','항공권','비행기'].includes(t) ? t : (from || to ? `${from || ''}${to ? to + '행' : ''}` : '항공편');
  }
  if (b.kind === 'transit'){
    const { from, to } = flightRoute(b); const vl = vehicleLabel(b);
    if (from && to) return `${vl} · ${from} → ${to}`;
    return b.title && b.title !== modeName(b.mode) ? b.title : vl;

}
function bookingWhen(b){
  const k = KIND[b.kind] || KIND.etc; if (!b.start) return '';
  if (b.kind === 'flight' && b.roundTrip && b.retStart) return `가는 편 ${fmtDT(b.start)} · 오는 편 ${fmtDT(b.retStart)}`;
  if (b.kind === 'transit' && b.end) return `${fmtDT(b.start)} → ${b.end.slice(0,10) === b.start.slice(0,10) ? b.end.slice(11,16) : fmtDT(b.end)}`;
  if (b.kind === 'flight' && b.end) return `${fmtDT(b.start)} → ${b.end.slice(0,10) === b.start.slice(0,10) ? b.end.slice(11,16) : fmtDT(b.end)}`;

}
/* bookings shown in the plan: computed from the booking itself, so editing or deleting the booking updates the plan */
function bookingEntries(tid, day){
  const out = [];
  S.bookings.filter(b => b.tripId === tid && b.showInPlan !== false && (b.start || b.end)).forEach(b => {
    const k = KIND[b.kind] || KIND.etc; const name = bookingName(b);
    const sd = b.start ? b.start.slice(0,10) : '', ed = b.end ? b.end.slice(0,10) : '';
    const st = b.start ? b.start.slice(11,16) : '', et = b.end ? b.end.slice(11,16) : '';
    const mk = (suffix, time, status, o = {}) => ({ id:`bk-${b.id}-${suffix}`, bk:true, bkId:b.id, kind:b.kind, time, status,
      place: o.place || name, sub: o.sub || `${k.label} · ${status}`, code: o.code || b.code,
      address: o.address === undefined ? b.address : o.address, memo: o.sub || `${k.label} ${status}`, photos:[] });
    if (b.kind === 'flight'){
      // departure row: "인천 출발 / 후쿠오카행", arrival row: "후쿠오카 도착 / 인천에서"
      const { from, to } = flightRoute(b);
      const goNo = b.flightNo || b.code, backNo = b.retFlightNo || b.code;
      if (sd === day) out.push(mk('a', st, k.a, { place: from ? `${from} 출발` : '항공편 출발', sub: to ? `${to}행 ${b.roundTrip ? '가는 편' : '항공편'}` : (b.roundTrip ? '가는 편' : '항공편'), address: b.address || airport(from), code: goNo }));
      if (ed === day && b.end) out.push(mk('b', et, k.b, { place: to ? `${to} 도착` : '항공편 도착', sub: from ? `${from}발 ${b.roundTrip ? '가는 편' : '항공편'}` : (b.roundTrip ? '가는 편' : '항공편'), address: airport(to), code: goNo }));
      if (b.roundTrip){
        const rsd = b.retStart ? b.retStart.slice(0,10) : '', red = b.retEnd ? b.retEnd.slice(0,10) : '';
        const { rfrom, rto } = retRoute(b);
        if (rsd === day) out.push(mk('c', b.retStart.slice(11,16), k.a, { place: rfrom ? `${rfrom} 출발` : '귀국편 출발', sub: rto ? `${rto}행 오는 편` : '오는 편', address: airport(rfrom), code: backNo }));
        if (red === day) out.push(mk('d', b.retEnd.slice(11,16), k.b, { place: rto ? `${rto} 도착` : '귀국편 도착', sub: rfrom ? `${rfrom}발 오는 편` : '오는 편', address: airport(rto), code: backNo }));
      }
    } else if (b.kind === 'transit'){
      const { from, to } = flightRoute(b); const vl = vehicleLabel(b);
      const seat = b.seat ? ` · ${b.seat}` : '';
      if (sd === day) out.push(mk('a', st, k.a, { place: from ? `${from} 출발` : `${vl} 출발`, sub: `${to ? `${to}행 ` : ''}${vl}${seat}`, address: b.address || stationOf(from, b.mode), code: b.code }));
      if (ed === day && b.end) out.push(mk('b', et, k.b, { place: to ? `${to} 도착` : `${vl} 도착`, sub: `${from ? `${from}발 ` : ''}${vl}`, address: stationOf(to, b.mode), code: b.code }));
    } else {
      const two = b.kind === 'car' && b.address2 && b.address2 !== b.address;
      if (sd === day) out.push(mk('a', st, k.a, two ? { sub: `${k.label} · ${k.a} · ${b.address}` } : {}));
      if (ed === day && !(b.kind === 'etc' && ed === sd && !et)) out.push(mk('b', et, k.b, two ? { sub: `${k.label} · ${k.b} · ${b.address2}`, address: b.address2 } : {}));
    }
  });
  return out;
}
const dayEntries = (tid, day) => [...dayItems(tid, day), ...bookingEntries(tid, day)].sort(byTime);

async function coverUpload(file){

function coverCommit(t){

  const old = t.cover; const oldOwn = t.coverOwn;
  if (keep && keep !== 'gen'){ t.cover = keep; t.coverOwn = editing.coverNew.includes(keep) || (keep === old && oldOwn); }

  if (on && on.scrollIntoView) { try { on.scrollIntoView({ block:'nearest', inline:'center' }); } catch(e){} }

function renderView(){

async function hydrate(root){

function currentTrip(){

  const up = S.trips.filter(t => t.start > td).sort((a,b) => a.start.localeCompare(b.start))[0]; if (up) return up;

function nowHM(){ const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

function backupNudge(){

  const amount = S.items.filter(i => ids.has(i.tripId)).length + S.bookings.filter(b => ids.has(b.tripId)).length + S.expenses.filter(e => ids.has(e.tripId)).length;
  const ended = real.filter(t => t.end < td && (!lb || lb <= t.end)).sort((a, b) => b.end.localeCompare(a.end))[0];
  let msg = '';
  if (ended) msg = `${esc(ended.title)}을(를) 다녀왔어요. 기록이 이 폰에만 있으니 백업해 두세요.`;
  else if (!lb && amount >= 3) msg = '아직 백업한 적이 없어요. 폰을 바꾸거나 잃어버리면 기록을 되살릴 수 없어요.';
  else if (lb && diffDays(lb, td) >= 14 && amount >= 1) msg = `마지막 백업이 ${diffDays(lb, td)}일 전이에요. 새로 적은 내용을 백업해 두세요.`;
  if (!msg) return '';
  return `<div class="banner warnb" role="status"><p>${msg}</p><div class="btns" style="gap:6px;flex-wrap:wrap"><button type="button" class="btn sm" data-act="backup-later">3일 뒤에</button>${ended ? `<button type="button" class="btn sm" data-act="recap" data-id="${ended.id}">요약 카드</button>` : ''}<button type="button" class="btn sm primary" data-act="backup">지금 백업</button></div></div>`;

function moveWish(id, dir){
  const w = S.wishes.find(x => x.id === id); const list = placeList(getTrip(w.tripId), false);
  const i = list.indexOf(w), j = i + dir; if (j < 0 || j >= list.length) return;
  const orders = list.map(x => x.order || 0); [list[i], list[j]] = [list[j], list[i]];
  const sorted = [...orders].sort((a, b) => a - b); list.forEach((x, k) => { x.order = sorted[k] + k * 1e-6; });
  S.wishes.filter(x => x.tripId === w.tripId && x.type === 'place').sort((a, b) => (a.order || 0) - (b.order || 0)).forEach((x, k) => { x.order = k; });

let sheetCancel = null; let lastFocus = null;
function openSheet(html, onCancel){
  const root = $('#sheet-root');
  if (!root.hidden && sheetCancel) { const c = sheetCancel; sheetCancel = null; c(); }
  lastFocus = document.activeElement;
  root.innerHTML = `<div class="backdrop" data-act="close-sheet"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="grab" aria-hidden="true"></div>${html}</section>`;
  root.hidden = false; sheetCancel = onCancel || null;
  document.body.style.overflow = 'hidden';
  hydrate(root);
  const f = root.querySelector('[autofocus]'); if (f) setTimeout(() => f.focus(), 60);
}
function closeSheet(cancel){
  const root = $('#sheet-root'); if (root.hidden) return;
  if (cancel && sheetCancel) sheetCancel();
  sheetCancel = null; root.hidden = true; root.innerHTML = ''; document.body.style.overflow = '';
  if (lastFocus && document.contains(lastFocus)) { try { lastFocus.focus({ preventScroll:true }); } catch(e){} }
}
const sheetHead = (title, saveAct, saveLabel='저장') => `<header class="sheet-head"><button type="button" class="textbtn" data-act="close-sheet">취소</button><h2 id="sheet-title">${title}</h2>${saveAct ? `<button type="button" class="textbtn strong" data-act="${saveAct}">${saveLabel}</button>` : '<span class="spacer"></span>'}</header>`;

/* photo drafts (shared by item & booking sheets) */
let draft = null;
function draftPhotosHTML(){
  const tiles = draft.photos.map((p,i) => `<div class="ph-tile">${photoImg(p)}<button type="button" class="ph-del" data-act="photo-del" data-id="${esc(p)}" aria-label="사진 ${i+1} 빼기">${I.x}</button></div>`).join('');
  const add = draft.photos.length < 10 ? `<label class="addtile" for="f-photo-input">${I.camera}사진 추가</label>` : '';
  return tiles + add;
}
function refreshDraftPhotos(){ const g = $('#draft-photos'); if (!g) return; g.innerHTML = draftPhotosHTML(); hydrate(g); const c = $('#draft-count'); if (c) c.textContent = `${draft.photos.length} / 10`; }
const photoField = label => `<div class="field"><span class="flabel">${label} <span id="draft-count">${draft.photos.length} / 10</span></span>
  <div class="photo-grid" id="draft-photos">${draftPhotosHTML()}</div>
  <input type="file" id="f-photo-input" accept="image/*" multiple hidden>
  <p class="hint">사진은 저장 전에 자동으로 작게 줄여 폰 용량을 아껴요.</p></div>`;
function startDraft(photos){ draft = { photos:[...photos], added:[], orig:[...photos] }; }
function cancelDraft(){ if (draft) photoDel(draft.added); draft = null; }
function commitDraft(){ const gone = [...draft.orig, ...draft.added].filter(p => !draft.photos.includes(p)); photoDel(gone); const out = [...draft.photos]; draft = null; return out; }
async function addPhotos(files){
  if (!draft) return; const room = 10 - draft.photos.length; const list = [...files].slice(0, room);
  if (!list.length) return; toast(list.length > 1 ? `사진 ${list.length}장을 줄이는 중…` : '사진을 줄이는 중…');
  for (const f of list){ try { const blob = await resizeImage(f); const id = uid(); await photoPut(id, blob); if (!draft) { photoDel([id]); return; } draft.photos.push(id); draft.added.push(id); refreshDraftPhotos(); } catch(e){ toast('이 사진은 열 수 없어요. 다른 사진을 골라 주세요.'); } }
  hideToast();
}
function loadImg(blob){ return new Promise((res, rej) => { const u = URL.createObjectURL(blob); const im = new Image(); im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(u), 1000); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; im.src = u; }); }
async function resizeImage(file, max=1600, q=0.82){
  let src, w, h, bmp = null;
  try { bmp = await createImageBitmap(file, { imageOrientation:'from-image' }); src = bmp; w = bmp.width; h = bmp.height; }
  catch(e){ const im = await loadImg(file); src = im; w = im.naturalWidth; h = im.naturalHeight; }
  const s = Math.min(1, max / Math.max(w, h)); const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w*s)); c.height = Math.max(1, Math.round(h*s));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); if (bmp && bmp.close) bmp.close();
  return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', q));
}

  S.checks.filter(c => c.tripId === srcId).forEach(c => { if (!have.has(c.label)) { S.checks.push({ id:uid(), tripId:V.tripId, group:c.group, label:c.label, done:false }); have.add(c.label); n++; } });

}

function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath(); }
function fit(g, text, maxW){ text = String(text); if (g.measureText(text).width <= maxW) return text; while (text.length > 1 && g.measureText(text + '…').width > maxW) text = text.slice(0, -1); return text + '…'; }
/* ---------- 여행 요약 카드 ---------- */
async function makeRecap(t){
  try { if (document.fonts && document.fonts.load) await Promise.all([document.fonts.load('700 40px "IBM Plex Sans KR"', t.title + '가나다 0123'), document.fonts.load('700 72px "Gowun Batang"', t.title + '가나다')]); } catch(e){}
  const W = 1080, H = 1350; const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const cs = getComputedStyle(document.documentElement); const tk = n => cs.getPropertyValue(n).trim();
  const bg = tk('--surface'), ink = tk('--ink'), muted = tk('--muted'), accent = tk('--accent'), line = tk('--line');
  const F = (w, s, fam) => `${w} ${s}px ${fam || '"IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif'}`;
  const serif = '"Gowun Batang", serif';
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const ph = 560; const cov = tripCover(t);
  g.fillStyle = tk(GEN_BG[hashStr(t.id) % GEN_BG.length]) || tk('--p1'); g.fillRect(0, 0, W, ph);
  if (cov){ const b = await photoGet(cov); if (b){ try { const im = await loadImg(b); const sc = Math.max(W / im.naturalWidth, ph / im.naturalHeight); const dw = im.naturalWidth * sc, dh = im.naturalHeight * sc; g.drawImage(im, (W - dw) / 2, (ph - dh) / 2, dw, dh); } catch(e){} } }
  else { g.fillStyle = ink; g.font = F(700, 96, serif); g.fillText(fit(g, tripCity(t), W - 128), 64, ph - 72); }
  const days = tripDays(t); const nights = days.length - 1;
  g.fillStyle = ink; g.font = F(700, 64, serif); g.fillText(fit(g, t.title, W - 128), 64, ph + 100);
  g.fillStyle = muted; g.font = F(500, 30); g.fillText(`${rangeLabel(t)} · ${nights ? `${nights}박 ` : ''}${days.length}일`, 64, ph + 150);
  const list = tripExpenses(t); const sm = expSummary(t, list);
  const places = new Set([...S.items.filter(i => i.tripId === t.id).map(i => i.place).filter(Boolean), ...S.wishes.filter(w => w.tripId === t.id && w.type === 'place' && w.done).map(w => w.label)]).size;
  const photos = tripPhotos(t.id).length;
  const stats = [[`${places}곳`, '다녀온 곳'], [`${photos}장`, '사진'], [sm.krw ? money(sm.krw, 'KRW') : '–', '총 비용'], [sm.multi ? money(sm.share, 'KRW') : `${list.length}건`, sm.multi ? '1인당' : '결제']];
  const top = ph + 200, cw = (W - 128 - 24) / 2, ch = 128;
  stats.forEach(([v, l], i) => { const x = 64 + (i % 2) * (cw + 24), y = top + Math.floor(i / 2) * (ch + 20);
    rr(g, x, y, cw, ch, 24); g.fillStyle = tk('--bg'); g.fill();
    g.fillStyle = muted; g.font = F(500, 26); g.fillText(l, x + 28, y + 46);
    g.fillStyle = ink; g.font = F(700, 44); g.fillText(fit(g, v, cw - 56), x + 28, y + 100); });
  const cats = CATS.filter(cc => sm.byCat[cc.id] > 0).sort((a, b) => sm.byCat[b.id] - sm.byCat[a.id]);
  if (sm.krw > 0){
    const by = top + 2 * (ch + 20) + 18; let x = 64; const bw = W - 128;
    g.save(); rr(g, 64, by, bw, 22, 11); g.clip();
    cats.forEach(cc => { const w = bw * sm.byCat[cc.id] / sm.krw; g.fillStyle = cc.color; g.fillRect(x, by, w, 22); x += w; }); g.restore();
    g.font = F(500, 24); let lx = 64; const ly = by + 64;
    cats.slice(0, 4).forEach(cc => { const label = `${cc.name} ${Math.round(sm.byCat[cc.id] / sm.krw * 100)}%`; g.fillStyle = cc.color; g.beginPath(); g.arc(lx + 8, ly - 8, 8, 0, Math.PI * 2); g.fill(); g.fillStyle = muted; g.fillText(label, lx + 24, ly); lx += g.measureText(label).width + 56; });
  }
  g.strokeStyle = line; g.lineWidth = 2; g.beginPath(); g.moveTo(64, H - 96); g.lineTo(W - 64, H - 96); g.stroke();
  g.font = F(600, 26); g.fillStyle = accent; g.textAlign = 'right'; g.fillText('트립노트', W - 64, H - 50); g.textAlign = 'left';
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'));
}

function saveCopy(){
  const t = getTrip(editing.id); const title = val('f-ctitle') || t.title; const start = val('f-cstart');
  if (!start) return showErr('출발일을 골라 주세요.');
  const len = diffDays(t.start, t.end); const end = addDays(start, len); const off = diffDays(t.start, start);
  const on = id => { const el = document.getElementById(id); return el && el.checked && !el.disabled; };
  const nt = { id: uid(), title, start, end, view: t.view || 'timeline' };
  if (on('c-people')){ if (t.members) nt.members = t.members.map(m => Object.assign({}, m)); if (t.rates) nt.rates = Object.assign({}, t.rates); nt.people = t.people; nt.lastCurrency = t.lastCurrency; if (t.wx && t.wx.loc && !t.wx.loc.auto) nt.wx = { loc: Object.assign({}, t.wx.loc) }; }
  S.trips.push(nt);
  if (on('c-checks')) S.checks.filter(c => c.tripId === t.id).forEach(c => S.checks.push({ id: uid(), tripId: nt.id, group: c.group, label: c.label, done: false }));
  const fresh = w => { const c = Object.assign({}, w, { id: uid(), tripId: nt.id, done: false, itemId: null, photos: [], expId: null, menu: (w.menu || []).map(m => Object.assign({}, m)) }); ['paid','paidCur','boughtAt','visitedAt','rating','review'].forEach(k => delete c[k]); return c; };

  if (on('c-place')) S.wishes.filter(w => w.tripId === t.id && w.type === 'place').forEach(w => S.wishes.push(fresh(w)));
  if (on('c-items')) S.items.filter(i => i.tripId === t.id).forEach(i => { const d = addDays(i.date, off); S.items.push({ id: uid(), tripId: nt.id, date: d < start ? start : d > end ? end : d, time: i.time, place: i.place, address: i.address, memo: i.memo, photos: [] }); });

}

/* ---------- 검색 ---------- */
function searchResults(q){
  q = q.trim().toLowerCase(); if (q.length < 1) return [];
  const has = (...xs) => xs.some(x => x && String(x).toLowerCase().includes(q));
  const out = [];
  S.trips.forEach(t => { if (has(t.title)) out.push({ tid: t.id, kind:'trip', id: t.id, title: t.title, sub: rangeLabel(t), icon:'cal' }); });
  S.items.forEach(i => { if (has(i.place, i.memo, i.address)) out.push({ tid: i.tripId, kind:'item', id: i.id, title: i.place || '일정', sub: `${md(i.date)}${i.time ? ' ' + i.time : ''}${i.memo ? ' · ' + i.memo.replace(/\n/g, ' ') : ''}`, icon:'list' }); });
  S.bookings.forEach(b => { if (has(b.title, b.code, b.memo, b.address, b.address2, b.from, b.to, b.flightNo)) out.push({ tid: b.tripId, kind:'booking', id: b.id, title: bookingName(b), sub: `${(KIND[b.kind] || KIND.etc).label}${b.code ? ' · ' + b.code : ''}`, icon: (KIND[b.kind] || KIND.etc).icon }); });
  S.expenses.forEach(e => { if (has(e.title, e.store, ...(e.tfItems || []).map(i => i.name))) out.push({ tid: e.tripId, kind:'exp', id: e.id, title: e.title || catOf(e.cat).name, sub: `${money(expTotal(e), e.currency)} · ${e.date === 'pre' ? '여행 전' : md(e.date)}`, icon:'wallet' }); });
  S.wishes.forEach(w => { if (has(w.label, w.orig, w.store, w.memo, w.address, w.review, ...(w.menu || []).map(m => m.name + ' ' + (m.orig || '')))) out.push({ tid: w.tripId, kind:'wish', id: w.id, title: w.label, sub: w.type === 'buy' ? `살 것${w.store ? ' · ' + w.store : ''}` : `가볼 곳${w.address ? ' · ' + w.address : ''}`, icon: w.type === 'buy' ? 'bag' : 'pin' }); });
  S.checks.forEach(c => { if (has(c.label)) out.push({ tid: c.tripId, kind:'check', id: c.id, title: c.label, sub: `준비물 · ${c.group}`, icon:'checklist' }); });
  Object.entries(S.notes).forEach(([k, v]) => { if (has(v)) { const [tid, day] = k.split('|'); out.push({ tid, kind:'note', id: k, day, title: v.length > 40 ? v.slice(0, 40) + '…' : v, sub: `한 줄 기록 · ${md(day)}`, icon:'book' }); } });
  return out.filter(r => getTrip(r.tid)).slice(0, 80);
}

  const cs = getComputedStyle(document.documentElement); const tk = n => cs.getPropertyValue(n).trim();

  'search-open': () => { focusAfter = 'search-q'; go({ name:'search', q:'' }); },
  'search-go': el => searchGo(el),
  'copy-trip': el => openCopySheet(el.dataset.id),
  'save-copy': () => saveCopy(),
  'recap': el => { go({ name:'trip', tripId: el.dataset.id, tab:'plan' }); SH.style = 'recap'; openShare(); },
  'wx-loc': () => openWxSheet(),
  'wx-scope': el => { editing.scope = el.dataset.val; $('#wx-scope').innerHTML = wxScopeSeg(tripDays(getTrip(V.tripId)).indexOf(V.day) + 1); },
  'wx-pick': el => wxPick(Number(el.dataset.val)),
  'wx-reset-day': () => { const t = getTrip(V.tripId); if (t.wx && t.wx.dayLoc){ delete t.wx.dayLoc[V.day]; } t.wx.fetchedAt = 0; save(); closeSheet(false); render(); refreshWeather(t, true); },
  'wx-refresh': () => { const t = getTrip(V.tripId); closeSheet(false); WX.err = false; render(); refreshWeather(t, true); },
  'list': el => { V.list = el.dataset.val; V.reorder = false; render(); },
  'tf': el => { editing.tf = el.dataset.val; $('#tf-seg').innerHTML = tfSeg(); $('#w-tf').hidden = editing.tf === 'none'; if (editing.tf !== 'none' && !editing.tfItems.length){ editing.tfItems.push({ id: uid(), name: val('f-etitle'), packed: false }); $('#tf-items').innerHTML = tfItemRows(); } if (editing.tf !== 'none' && !val('f-store') && val('f-etitle')) $('#f-store').value = val('f-etitle'); if (editing.cat !== 'shop' && editing.tf !== 'none'){ editing.cat = 'shop'; $('#cat-chips').innerHTML = catChips(); } updTfHint(); },
  'tf-rate': el => { editing.taxRate = +el.dataset.val; $('#rate-seg').innerHTML = rateSeg(); updTfHint(); },
  'tfi-add': () => { readTfItems(); editing.tfItems.push({ id: uid(), name: '', packed: false }); $('#tf-items').innerHTML = tfItemRows(); const ins = document.querySelectorAll('[data-tfi]'); ins[ins.length - 1].focus(); },
  'tfi-del': el => { readTfItems(); editing.tfItems.splice(+el.dataset.val, 1); $('#tf-items').innerHTML = tfItemRows(); },
  'tf-check': el => { if (el.dataset.trip && (V.name !== 'trip' || V.tripId !== el.dataset.trip)) go({ name:'trip', tripId: el.dataset.trip, tab:'money' }); openTfCheck(); },
  'tf-pack': el => { const e = S.expenses.find(x => x.id === el.dataset.exp); const it = e && (e.tfItems || []).find(i => i.id === el.dataset.item); if (!it) return; it.packed = !it.packed; save(); const sc = $('.sheet') ? $('.sheet').scrollTop : 0; openTfCheck(); if ($('.sheet')) $('.sheet').scrollTop = sc; render(); },
  'tf-done': el => { const e = S.expenses.find(x => x.id === el.dataset.id); if (!e) return; e.taxfree = e.taxfree === 'refunded' ? 'applied' : 'refunded'; save(); const sc = $('.sheet') ? $('.sheet').scrollTop : 0; openTfCheck(); if ($('.sheet')) $('.sheet').scrollTop = sc; render(); },
  'wish-new': el => openWishNew(el.dataset.val),
  'thumb-photo': el => { let inp = $('#thumb-input'); if (!inp){ inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.id = 'thumb-input'; inp.hidden = true; document.body.appendChild(inp); } inp.dataset.wish = el.dataset.id; inp.value = ''; inp.click(); },
  'wish-tf': el => { const w = S.wishes.find(x => x.id === el.dataset.id); if (!w) return; w.tf = !w.tf; const ex = w.expId ? S.expenses.find(e => e.id === w.expId) : null;
    if (ex && w.tf && !ex.taxfree){ ex.taxfree = 'applied'; ex.store = ex.store || w.store || ''; ex.tfItems = [...(ex.tfItems || []), { id: uid(), name: w.label, packed: false, wishId: w.id }]; }
    if (ex && !w.tf && ex.taxfree && (ex.tfItems || []).length <= 1){ delete ex.taxfree; delete ex.tfItems; }
    save(); render(); openWishView(w.id); toast(w.tf ? '면세로 산 것으로 표시했어요' : '면세 표시를 껐어요'); },
  'toggle-wish': el => toggleWish(el.dataset.id),
  'view-wish': el => openWishView(el.dataset.id),
  'show-staff': el => showStaff(el.dataset.id),
  'wtab': el => { V[el.dataset.key] = el.dataset.val; V.reorder = false; V.pkind = 'all'; render(); },
  'pkind': el => { V.pkind = el.dataset.val; V.reorder = false; render(); },
  'paste-list': el => openPasteList(el.dataset.val),
  'paste-read': () => { editing.found = parseRecList(val('f-plist'), editing.type); pastePreview(); },
  'paste-add': () => pasteAdd(),
  'menu-add': () => { readMenu(); editing.menu.push({ name:'', orig:'', price:'' }); $('#menu-rows').innerHTML = menuRowsHTML(); const ins = document.querySelectorAll('[data-f="name"]'); ins[ins.length - 1].focus(); },
  'menu-del': el => { readMenu(); editing.menu.splice(+el.dataset.val, 1); $('#menu-rows').innerHTML = menuRowsHTML(); },
  'pick-pkind': el => { editing.pkind = el.dataset.val; refreshPlaceForm(); },
  'shop-buys': el => { const w = S.wishes.find(x => x.id === el.dataset.id); const name = val('f-wlabel') || w.label; closeSheet(true); V.list = 'buy'; V.buyTab = 'todo'; render(); const q = $('#wish-new'); if (q){ q.value = ` @${name}`; q.focus(); q.setSelectionRange(0, 0); } toast(`'@${name}' 앞에 상품 이름을 적으면 이 가게로 모여요`, 3500); },
  'save-bought': () => saveBought(false),
  'bought-skip': () => saveBought(true),
  'save-visited': () => saveVisited(false),
  'visited-skip': () => saveVisited(true),
  'rate': el => { const n = +el.dataset.val; editing.rating = editing.rating === n ? 0 : n; $('#rating').innerHTML = ratingBtns(); },
  'edit-wish': el => openWishSheet(el.dataset.id),
  'save-wish': () => saveWish(),
  'del-wish': el => deleteWish(el.dataset.id),
  'reorder': () => { V.reorder = !V.reorder; render(); },
  'sort-near': () => askSortNearest(),
  'move-wish': el => moveWish(el.dataset.id, Number(el.dataset.val)),
  'toggle-check': el => { const c = S.checks.find(x => x.id === el.dataset.id); c.done = !c.done; save(); render(); },
  'edit-check': el => openCheckSheet(el.dataset.id),
  'save-check': () => saveCheck(),
  'del-check': el => deleteCheck(el.dataset.id),
  'import-checks': () => openImportChecks(),
  'import-from': el => importFrom(el.dataset.id),
  'pick-theme': el => { S.settings.theme = el.dataset.val || null; save(); render(); openSettings(); },
  'share-style': el => { SH.style = el.dataset.val; document.querySelectorAll('[data-act="share-style"]').forEach(b => { const on = b.dataset.val === SH.style; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); const p = $('#share-preview'); if (p) p.textContent = '카드를 만드는 중…'; buildShareImage(); },
  'share-scope': el => { SH.scope = el.dataset.val; document.querySelectorAll('[data-act="share-scope"]').forEach(b => { const on = b.dataset.val === SH.scope; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); },
  'share-image': () => shareImage(),
  'save-image': () => saveImage(),
  'share-text': () => shareText(),
  'copy-text': () => copyText(shareTextNow()),
  'confirm-ok': () => { const fn = confirmFn; confirmFn = null; closeSheet(false); if (fn) fn(); },
  'close-sheet': () => closeSheet(true),
  'undo': () => { const u = window.__undo; window.__undo = null; pendingCommit = null; clearTimeout(toastTimer); $('#toast-root').innerHTML = ''; if (u) u(); },
};
document.addEventListener('click', e => {
  const link = e.target.closest('a[href]');
  if (link && !link.dataset.act){ if (link.getAttribute('href') === '#') e.preventDefault(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (suppressClick && el.closest('.swipe')) { e.preventDefault(); return; }
  const fn = A[el.dataset.act]; if (fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#viewer-root').innerHTML) return closeViewer(); if (!$('#sheet-root').hidden) return closeSheet(true); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target.dataset.form;
  if (f === 'quick'){ const v = val('quick'); if (!v) return; const p = parseQuick(v); S.items.push({ id:uid(), tripId:V.tripId, date:V.day, time:p.time, place:p.place, address:'', memo:'', photos:[] }); save(); focusAfter = 'quick'; render(); toast(`${p.time ? p.time + ' ' : ''}${p.place || '일정'} 추가했어요`); }
  else if (f === 'quick-exp'){
    const t = getTrip(V.tripId); const v = val('quick-exp'); if (!v) return;
    const pw = takePayWord(v); const p = parseExpense(pw.text, t.lastCurrency || 'KRW'); const pay = pw.pay || normPay(V.lastPay || t.lastPay);
    if (!p.amount) return toast('금액도 같이 적어 주세요. 예: 라멘 1200엔', 3000);
    const cat = guessCat(p.title) || 'etc';
    S.expenses.push({ id:uid(), tripId:t.id, date: defaultExpDate(t), cat, title: p.title || catOf(cat).name, amount: p.amount, currency: p.currency, pay, mode:'total', pax: t.people || 1 });
    t.lastCurrency = p.currency; save(); focusAfter = 'quick-exp'; render();
    toast(`${p.title || catOf(cat).name} ${money(p.amount, p.currency)} · ${catOf(cat).name} · ${payName(pay)}로 넣었어요`, 3000);
  }
  else if (f === 'exp') saveExp(); else if (f === 'money') saveMoneySettings();
  else if (f === 'wx-search'){ wxSearch(); }
  else if (f === 'copy') saveCopy();
  else if (f === 'search'){ const q = $('#search-q'); if (q) q.blur(); }
  else if (f === 'add-wish'){
    const v = val('wish-new'); if (!v) return; const type = e.target.dataset.type;
    if (type === 'buy'){ const p = parseBuyQuick(v); S.wishes.push({ id:uid(), tripId:V.tripId, type, label:p.label || v, store:p.store, qty:p.qty, memo:'', photos:[], done:false }); }
    else { const max = Math.max(-1, ...S.wishes.filter(w => w.tripId === V.tripId && w.type === 'place').map(w => w.order || 0)); const kind = guessKind(v) || 'etc'; S.wishes.push({ id:uid(), tripId:V.tripId, type, label:v, kind, address:'', memo:'', menu:[], photos:[], done:false, order:max + 1 });
      if ((V.pkind || 'all') !== 'all' && V.pkind !== kind) V.pkind = 'all'; }
    save(); focusAfter = 'wish-new'; render();
    const nw = S.wishes[S.wishes.length - 1]; actionToast(`'${nw.label}' 추가했어요`, '사진·자세히', () => openWishSheet(nw.id));
  }
  else if (f === 'wish') saveWish();
  else if (f === 'bought') saveBought(false); else if (f === 'visited') saveVisited(false);
  else if (f === 'add-check'){ const label = val('check-new'); if (!label) return; const group = val('check-group'); V.lastGroup = group; S.checks.push({ id:uid(), tripId:V.tripId, group, label, done:false }); save(); focusAfter = 'check-new'; render(); }
  else if (f === 'item') saveItem(); else if (f === 'trip') saveTrip(); else if (f === 'booking') saveBooking(); else if (f === 'check') saveCheck();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.note){ if (t.value.trim()) S.notes[t.dataset.note] = t.value; else delete S.notes[t.dataset.note]; save(); }
  if (t.id === 'search-q'){ V.q = t.value; const box = $('#search-results'); if (box) box.innerHTML = searchListHTML(V.q); }
  if (['f-amt','f-bprice','f-pax','f-cur','f-bcur'].includes(t.id)) updPmHint();
  if (['f-amt','f-store','f-etitle'].includes(t.id)) updTfHint();
  if (t.id === 'f-waddr' || t.id === 'f-wlabel'){ const a = $('#f-wmap'); if (a) a.href = mapUrl(val('f-waddr') || val('f-wlabel')); }
  if (t.id === 'f-from' || t.id === 'f-to'){ const rf = $('#f-rfrom'), rt2 = $('#f-rto'); if (rf) rf.placeholder = val('f-to') ? `비워두면 ${val('f-to')}` : '예: 오사카'; if (rt2) rt2.placeholder = val('f-from') ? `비워두면 ${val('f-from')}` : '예: 인천'; }
  if (t.id === 'f-place' || t.id === 'f-address'){ const a = $('#f-maplink'); const q = val('f-address') || val('f-place'); if (a){ a.href = q ? mapUrl(q) : '#'; a.style.opacity = q ? '' : '.5'; a.style.pointerEvents = q ? '' : 'none'; a.toggleAttribute('aria-disabled', !q); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-photo-input'){ addPhotos(t.files); t.value = ''; }
  if (t.id === 'thumb-input' && t.files[0]){ const w = S.wishes.find(x => x.id === t.dataset.wish); const f = t.files[0]; t.value = '';
    if (w) resizeImage(f).then(async blob => { const id = uid(); await photoPut(id, blob); w.photos = [...(w.photos || []), id]; save(); render(); toast('사진을 넣었어요'); }).catch(() => toast('이 사진은 열 수 없어요. 다른 사진을 골라 주세요.')); }
  if (t.id === 'f-receipt' && t.files[0]){ const f = t.files[0]; t.value = ''; readReceipt(f); }
  if (t.id === 'f-cover-input' && t.files[0]){ const f = t.files[0]; t.value = ''; coverUpload(f); }
  if (t.id === 'f-frombase'){ V.fromBase = t.checked; render(); }
  if (t.id === 'f-cur' || t.id === 'f-bcur') updPmHint();
  if (t.id === 'f-cur' || t.id === 'f-edate') updTfHint();
  if (t.id === 'f-tfbuy'){ $('#w-tfrec').hidden = !t.checked; if (t.checked){ const x = $('#f-toexp'); x.checked = true; } }
  if (t.id === 'f-toexp' && !t.checked && $('#f-tfbuy') && $('#f-tfbuy').checked){ t.checked = true; toast('면세로 산 건 영수증 확인을 위해 비용에 함께 넣어요'); }
  if (t.id === 'restore-input' && t.files[0]){ const f = t.files[0]; t.value = ''; importBackup(f); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', flush);
try { if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme()); } catch(e){}

/* ---------- start ---------- */
(async function init(){
  await idbOpen();
  let st = await loadState();
  S = normalize(st || sampleState());
  render();
  if (!st) flush();
  if (!EMBED){
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
    if ('serviceWorker' in navigator && location.protocol === 'https:'){
      const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || reloaded) return; reloaded = true; flush().then(() => location.reload()); });
      navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(reg => {
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
      }).catch(() => {});
    }
  }
})();
window.__tripnote = { parseQuick };
})();
</script>
